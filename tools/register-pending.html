<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>未登録キャラ 一括登録ツール</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7fb;--fg:#1d2030;--card:#fff;--ac:#3b6fd4;--bd:#d5d9e6}
@media(prefers-color-scheme:dark){:root{--bg:#161823;--fg:#e8eaf3;--card:#222536;--ac:#7aa2ff;--bd:#3a3f57}}
body{margin:0;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:24px 12px}
main{width:100%;max-width:600px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:24px}
h1{font-size:1.3rem;margin:0 0 12px}
label{display:block;margin:14px 0 4px;font-size:.9rem;font-weight:600}
input[type=text],input[type=file]{width:100%;box-sizing:border-box;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
button{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--ac)}button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;margin-top:12px}.row>button{flex:1}
.hint{font-size:.85rem;opacity:.75;margin:4px 0}
.status{font-size:.9rem;margin-top:12px;padding:8px 12px;border-radius:8px;border:1px solid var(--bd)}
.q{font-size:1.25rem;min-height:3em;margin:10px 0}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar>div{height:100%;background:var(--ac)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-size:.85rem}
.top button{padding:6px 10px;font-size:.85rem}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:.9rem}
.big{font-size:1.4rem;font-weight:700;margin:6px 0}
.hide{display:none}
kbd{border:1px solid var(--bd);border-radius:4px;padding:0 4px;font-size:.8rem}
</style>
</head>
<body>
<main>
<h1>未登録キャラ 一括登録ツール</h1>
<div class="top hide" id="top"><span id="remain"></span><span><button id="ghTop">GitHubに保存</button> <button id="dlTop">ダウンロード</button></span></div>
<div class="hint" id="ghmsg"></div>

<section id="setup">
  <div id="ghslot"></div>
  <label>elements.json</label><input type="file" id="fe" accept=".json,application/json">
  <label>characters.json(未登録キャラを含むもの)</label><input type="file" id="fc" accept=".json,application/json">
  <div class="chk"><input type="checkbox" id="inferOn" checked><label for="inferOn" style="margin:0;font-weight:400">親子関係で質問を省略する</label></div>
  <div class="chk"><input type="checkbox" id="autoGh" checked><label for="autoGh" style="margin:0;font-weight:400">5人登録するごとにGitHubへ自動保存(連携設定時)</label></div>
  <div class="status" id="status">GitHubから読み込むか、2つのファイルを選んでください。</div>
  <div class="row"><button class="primary" id="start" disabled>未登録キャラを順に登録する</button></div>
  <div class="row hide" id="resumeRow"><button id="resume">ブラウザに保存された途中経過から再開</button></div>
  <div class="hint">「未登録キャラ」= characters.json の中で elements が空のキャラです。途中経過はキャラ1人ごとにこのブラウザへ自動保存されます。</div>
</section>

<section id="nameStep" class="hide">
  <div class="bar"><div id="nprog" style="width:0"></div></div>
  <div class="hint" id="ncnt"></div>
  <div class="hint">ID: <code id="nid"></code></div>
  <label>名前</label><input type="text" id="nname">
  <label>別名(カンマ区切り)</label><input type="text" id="nalias">
  <div class="row"><button class="primary" id="nnext">質問を始める →</button></div>
  <div class="row"><button id="nskip">後で(スキップ)</button><button id="ndel">リストから削除</button></div>
</section>

<section id="ask" class="hide">
  <div class="hint" id="who"></div>
  <div class="bar"><div id="prog" style="width:0"></div></div>
  <div class="hint" id="cnt"></div>
  <div class="hint" id="catname"></div>
  <div class="q" id="qtext"></div>
  <div class="row"><button id="b1" class="primary">はい (1/Y)</button><button id="b0">いいえ (0/N)</button><button id="bu">わからない (U)</button></div>
  <div class="row"><button id="back">← 戻る (B)</button></div>
  <div class="row"><button id="rest0">残りすべて「いいえ」で確定</button><button id="restu">残りすべて「不明」で確定</button></div>
  <div class="hint">キーボード: <kbd>1</kbd>/<kbd>Y</kbd> はい ・ <kbd>0</kbd>/<kbd>N</kbd> いいえ ・ <kbd>U</kbd>/<kbd>Space</kbd> わからない ・ <kbd>B</kbd>/<kbd>Backspace</kbd> 戻る</div>
</section>

<section id="fin" class="hide">
  <div class="big">お疲れさまでした</div>
  <div class="status" id="finmsg"></div>
  <div class="row"><button class="primary" id="dlFin">characters.json をダウンロード</button></div>
  <div class="row hide" id="againRow"><button id="again">スキップしたキャラをもう一度</button></div>
</section>
</main>

<script src="gh.js"></script>
<script>
/* ===== ロジック ===== */
let elements=[], data={characters:[]}, rawE=null;
function setElements(e){rawE=e;elements=e.categories.flatMap(cat=>cat.elements.map(el=>({...el,cat})))}
function anc(id,o=new Set()){const el=elements.find(x=>x.id===id);(el?.parents||[]).forEach(p=>{if(!o.has(p)){o.add(p);anc(p,o)}});return o}
const depth=id=>anc(id).size;
const questionText=el=>(el.question||el.cat.question_template||"{name}ですか?").replaceAll("{name}",el.name);
function currentMap(ch){
  const m={};if(!ch)return m;
  if(ch.elements){for(const[k,v]of Object.entries(ch.elements))m[k]=(v.confidence===0||v.value<0)?null:v.value}
  else{elements.forEach(x=>m[x.id]=0);(ch.unknown||[]).forEach(k=>m[k]=null);(ch.has||[]).forEach(k=>m[k]=1)}
  return m;
}
function infer(id,eff){
  if(elements.some(x=>x.id!==id&&anc(x.id).has(id)&&eff[x.id]===1))return 1;
  if([...anc(id)].some(p=>eff[p]===0))return 0;
  return null;
}
const isPending=c=>!!c.elements&&!Array.isArray(c.elements)&&Object.keys(c.elements).length===0&&!c.has&&!c.unknown;
const suggestAliases=n=>{const f=n.split("・")[0];return(n.includes("・")&&f.length>=2)?f:""};
function advance(s){let i=s.pos+1;while(i<s.queue.length&&s.skip(s,s.queue[i]))i++;s.pos=i}
const finished=s=>s.pos>=s.queue.length;
function answer(s,v){s.answers[s.queue[s.pos].id]=v;s.hist.push(s.pos);advance(s)}
function back(s){if(!s.hist.length)return;const i=s.hist.pop();delete s.answers[s.queue[i].id];s.pos=i}
function remaining(s){let n=0;for(let i=s.pos;i<s.queue.length;i++)if(i===s.pos||!s.skip(s,s.queue[i]))n++;return n}
function fillRest(s,v){while(!finished(s))answer(s,v)}
const eff=s=>({...s.base,...s.answers});
function makeSession(ch,inferOn){
  const base=currentMap(ch);
  const queue=elements.filter(el=>base[el.id]===undefined||base[el.id]===null).sort((a,b)=>depth(a.id)-depth(b.id));
  const s={base,queue,answers:{},hist:[],pos:-1,inferOn,
    skip:(s,el)=>s.answers[el.id]===undefined&&s.inferOn&&infer(el.id,eff(s))!==null};
  advance(s);return s;
}
function finalize(s){
  const e=eff(s),out={};
  for(const el of elements){
    let v=s.answers[el.id]!==undefined?s.answers[el.id]:s.base[el.id];
    if(v===undefined||v===null){const f=s.inferOn?infer(el.id,e):null;v=f}
    out[el.id]=v===null?{value:-1,confidence:0}:{value:v,confidence:1};
  }
  return out;
}

/* ===== UI ===== */
const $=id=>document.getElementById(id);
const LS="mushoku_register_pending_v1";
let pend=[],pi=0,cur=null,S=null,loaded={e:false,c:false};
const show=n=>["setup","nameStep","ask","fin"].forEach(k=>$(k).classList.toggle("hide",k!==n));
const findChar=id=>data.characters.find(c=>c.id===id);
const upd=ch=>{data={...data,characters:data.characters.map(c=>c.id===ch.id?ch:c)};save()};
function save(){try{localStorage.setItem(LS,JSON.stringify(data))}catch(e){}}
function saved(){try{const t=localStorage.getItem(LS);return t?JSON.parse(t):null}catch(e){return null}}
const pendCount=()=>data.characters.filter(isPending).length;
function topbar(){$("top").classList.remove("hide");$("remain").textContent=`未登録 残り ${pendCount()} 人 / 全 ${data.characters.length} 人`}
function refresh(){
  const sv=saved();
  $("resumeRow").classList.toggle("hide",!(sv&&loaded.e));
  if(!loaded.e||!loaded.c){$("status").textContent=loaded.e?"characters.json を選んでください。":"elements.json を選んでください。";$("start").disabled=true;return}
  $("status").textContent=`要素 ${elements.length} 件 / キャラ ${data.characters.length} 人 / 未登録 ${pendCount()} 人。`+(pendCount()?"":" 未登録のキャラはいません。");
  $("start").disabled=pendCount()===0;
}
async function load(input,cb,key){
  try{cb(JSON.parse(await input.files[0].text()));loaded[key]=true}catch(e){$("status").textContent="JSONを読み込めませんでした: "+e.message;return}
  refresh();
}
$("fe").onchange=()=>load($("fe"),e=>{if(!Array.isArray(e.categories))throw new Error("categories がありません");setElements(e)},"e");
$("fc").onchange=()=>load($("fc"),c=>{if(!Array.isArray(c.characters))throw new Error("characters がありません");data=c},"c");
function begin(){pend=data.characters.filter(isPending).map(c=>c.id);pi=0;topbar();nextChar()}
$("start").onclick=begin;
$("resume").onclick=()=>{const sv=saved();if(!sv)return;data=sv;loaded.c=true;begin()};

function nextChar(){
  while(pi<pend.length&&!(findChar(pend[pi])&&isPending(findChar(pend[pi]))))pi++;
  topbar();
  if(pi>=pend.length)return fin();
  cur=findChar(pend[pi]);
  $("nprog").style.width=(pi/pend.length*100)+"%";
  $("ncnt").textContent=`キャラ ${pi+1} / ${pend.length}`;
  $("nid").textContent=cur.id;$("nname").value=cur.name;
  $("nalias").value=(cur.aliases&&cur.aliases.length?cur.aliases:[suggestAliases(cur.name)].filter(Boolean)).join(", ");
  show("nameStep");$("nname").focus();
}
$("nnext").onclick=()=>{
  const name=$("nname").value.trim()||cur.name;
  cur={...cur,name,aliases:$("nalias").value.split(/[,、]/).map(x=>x.trim()).filter(Boolean)};upd(cur);
  S=makeSession(cur,$("inferOn").checked);
  $("who").textContent=`${cur.name}(${cur.id})`;
  finished(S)?commit():(show("ask"),render());
};
$("nskip").onclick=()=>{pi++;nextChar()};
$("ndel").onclick=()=>{if(!confirm(`「${cur.name}」を characters.json から削除しますか?`))return;
  data={...data,characters:data.characters.filter(c=>c.id!==cur.id)};save();pi++;nextChar()};
function render(){
  const el=S.queue[S.pos],asked=S.hist.length,total=asked+remaining(S);
  $("cnt").textContent=`質問 ${asked+1} / ${total}`;$("prog").style.width=(asked/total*100)+"%";
  $("catname").textContent=el.cat.name;$("qtext").textContent=questionText(el);$("back").disabled=!S.hist.length;
}
let since=0,pushing=false;
async function pushNow(){
  if(pushing)return;pushing=true;$("ghmsg").textContent="GitHubへ保存中…";
  try{await GH.push([{name:"characters.json",obj:data}],"キャラを登録("+pendCount()+"人が未登録)");$("ghmsg").textContent="GitHubに保存しました。"}
  catch(err){$("ghmsg").textContent="GitHub保存に失敗: "+err.message}
  pushing=false}
$("ghTop").onclick=pushNow;
function commit(){upd({...cur,elements:finalize(S)});if($("autoGh").checked&&GH.ready()&&++since>=5){since=0;pushNow()}pi++;nextChar()}
const ans=v=>{answer(S,v);finished(S)?commit():render()};
$("b1").onclick=()=>ans(1);$("b0").onclick=()=>ans(0);$("bu").onclick=()=>ans(null);
$("back").onclick=()=>{back(S);render()};
$("rest0").onclick=()=>{fillRest(S,0);commit()};$("restu").onclick=()=>{fillRest(S,null);commit()};
document.addEventListener("keydown",e=>{
  if($("ask").classList.contains("hide")||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==="1"||k==="y")ans(1);else if(k==="0"||k==="n")ans(0);else if(k==="u"||k===" "||k==="2"){e.preventDefault();ans(null)}
  else if((k==="b"||k==="backspace")&&S.hist.length){e.preventDefault();back(S);render()}
});
function fin(){
  const n=pendCount();
  $("finmsg").textContent=n?`今回は登録を終えました。スキップしたキャラが ${n} 人、未登録のまま残っています。`:"すべてのキャラの登録が完了しました。";
  $("againRow").classList.toggle("hide",!n);show("fin");if($("autoGh").checked&&GH.ready())pushNow();
}
$("again").onclick=begin;
const dl=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)+"\n"],{type:"application/json"}));a.download="characters.json";a.click()};
$("dlTop").onclick=dl;$("dlFin").onclick=dl;
GH.ui($("ghslot"),(e,c)=>{setElements(e);data=c;loaded.e=loaded.c=true;refresh()});
refresh();
</script>
</body>
</html>
